name: VOC build and tests (no deployment)

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voc-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: domain
            base: /
          - target: project
            base: /voc-frontend/
    env:
      VOC_BASE_PATH: ${{ matrix.base }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.30.2
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check workflow safeguards and source files
        run: |
          pnpm test:publishing
          pnpm check:sources
          pnpm audit --audit-level=high
      - name: TypeScript
        run: pnpm typecheck
      - name: Production build
        run: pnpm build
      - name: Install matching CI browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser regression tests
        run: pnpm test
        env:
          PLAYWRIGHT_USE_EXISTING_BUILD: "1"
      - name: Check publishable files
        run: pnpm check:dist
      - name: Store private build artifact only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voc-static-${{ matrix.target }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: false
